<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Eye Care Optical</title>
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👓</text></svg>">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Admin CSS -->
    <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

    <div class="login-screen-wrap">
        <div class="login-card">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-3 p-3 mb-2" style="width: 54px; height: 54px;">
                    <i class="fas fa-glasses fs-4"></i>
                </div>
                <h3 class="fw-bold text-dark mt-2">Eye Care Optical</h3>
                <p class="text-muted small">Website Content & Inventory Management Panel</p>
            </div>

            <div id="loginAlert" class="alert alert-danger d-none py-2 px-3 small">
                <i class="fas fa-exclamation-circle me-1"></i> Invalid username or password.
            </div>

            <form id="adminLoginForm">
                <div class="mb-3">
                    <label class="form-label fw-semibold small text-muted">Admin Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fas fa-user text-muted"></i></span>
                        <input type="text" id="adminUser" class="form-control" value="admin" required placeholder="Enter username">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold small text-muted">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fas fa-lock text-muted"></i></span>
                        <input type="password" id="adminPass" class="form-control" value="eyecare123" required placeholder="Enter password">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold rounded-3 mb-3">
                    <i class="fas fa-sign-in-alt me-2"></i>Sign In to Dashboard
                </button>
            </form>

            <div class="p-3 bg-light rounded-3 border text-center small text-muted mb-3">
                <div class="fw-bold text-dark mb-1"><i class="fas fa-key text-warning me-1"></i>Demo Login Credentials:</div>
                <div>Username: <code>admin</code></div>
                <div>Password: <code>eyecare123</code></div>
            </div>

            <div class="text-center">
                <a href="../index.html" class="text-decoration-none small text-muted">
                    <i class="fas fa-arrow-left me-1"></i> Return to Main Website
                </a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("adminLoginForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const u = document.getElementById("adminUser").value.trim();
            const p = document.getElementById("adminPass").value.trim();

            if (u === "admin" && p === "eyecare123") {
                sessionStorage.setItem("eyecare_admin_auth", "true");
                sessionStorage.setItem("eyecare_admin_user", u);
                window.location.href = "index.html";
            } else {
                document.getElementById("loginAlert").classList.remove("d-none");
            }
        });
    </script>
</body>
</html>
